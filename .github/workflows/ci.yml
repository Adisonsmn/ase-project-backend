# Gerbang kualitas untuk kode yang belum masuk main.
name: CI

# Hanya pull_request. Kalau push ikut dipicu, setiap dorongan ke branch yang
# sudah punya PR akan menjalankan tes dua kali dengan hasil yang sama persis.
# Push ke main sendiri sudah diuji oleh workflow Deploy sebelum deploy jalan.
on:
  pull_request:

# Push baru ke branch yang sama membatalkan run lama: hasilnya sudah usang.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml
