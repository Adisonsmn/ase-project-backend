# Deploy otomatis ke Azure Container Apps setiap ada perubahan di main.
name: Deploy

on:
  push:
    branches:
      - main
  # Memungkinkan deploy ulang manual dari tab Actions tanpa perlu commit kosong.
  workflow_dispatch:

# Dua deploy yang jalan bersamaan bisa membuat revisi yang lebih lama menimpa
# yang lebih baru. Antrikan, jangan dibatalkan: run yang sudah mendorong image
# harus diselesaikan sampai container app ikut diperbarui.
concurrency:
  group: deploy-ase-backend
  cancel-in-progress: false

env:
  REGISTRY: asebackendacr01.azurecr.io
  IMAGE_NAME: ase-backend
  RESOURCE_GROUP: ase-backend-rg
  APP_NAME: ase-backend

jobs:
  # Mendorong kode yang gagal test ke production jauh lebih mahal daripada
  # menunggu satu menit di sini.
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Wajib: token inilah yang ditukar dengan kredensial Azure lewat OIDC,
      # sehingga tidak ada password Azure yang perlu disimpan di GitHub.
      id-token: write

    # PENTING: memakai `environment` mengubah subject pada token OIDC. Subject
    # tidak lagi berbentuk `...:ref:refs/heads/main`, melainkan
    # `...:environment:production`. Federated credential di Azure harus cocok
    # persis, kalau tidak login gagal dengan AADSTS700213 - dan pesannya sama
    # sekali tidak menyinggung blok ini sebagai penyebab.
    #
    # Repo ini juga memakai format subject ber-ID, sehingga nilai lengkapnya:
    #   repo:Adisonsmn@140268974/ase-project-backend@1361243275:environment:production
    #
    # Kalau blok ini dihapus atau namanya diganti, federated credential
    # `github-env-production` di app registration `ase-backend-github-actions`
    # wajib ikut disesuaikan.
    environment:
      name: production
      url: https://${{ steps.deploy.outputs.fqdn }}

    steps:
      - uses: actions/checkout@v4

      - name: Login ke Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login ke Azure Container Registry
        run: az acr login --name asebackendacr01

      - uses: docker/setup-buildx-action@v3

      # Image diberi tag commit SHA, bukan hanya "latest", supaya revisi yang
      # sedang berjalan di Azure selalu bisa ditelusuri balik ke kode persisnya.
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Perbarui container app
        id: deploy
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" \
            --output none

          FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

          REVISI=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.latestRevisionName --output tsv)
          echo "Revisi aktif: $REVISI" >> "$GITHUB_STEP_SUMMARY"

      # Container app melaporkan "berhasil diperbarui" begitu revisi diterima,
      # bukan begitu aplikasinya siap melayani. Tanpa langkah ini, deploy yang
      # crash saat migrasi Prisma tetap terlihat hijau.
      - name: Smoke test /health/ready
        run: |
          URL="https://${{ steps.deploy.outputs.fqdn }}/health/ready"
          for percobaan in $(seq 1 12); do
            KODE=$(curl -sS -o respons.json -w '%{http_code}' --max-time 15 "$URL" || echo 000)
            if [ "$KODE" = "200" ]; then
              echo "Sehat setelah percobaan ke-$percobaan:"
              cat respons.json
              exit 0
            fi
            echo "Percobaan ke-$percobaan: HTTP $KODE, menunggu 10 detik..."
            sleep 10
          done
          echo "::error::Revisi baru tidak pernah sehat setelah 2 menit."
          cat respons.json || true
          echo "Cek log: az containerapp logs show -n $APP_NAME -g $RESOURCE_GROUP --follow"
          exit 1
